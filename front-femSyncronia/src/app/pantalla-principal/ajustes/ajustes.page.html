<ion-content [fullscreen]="true" class="fondo-construccion">
  <br>
  <div class="encabezado-centrado">
    <p class="titulo">Configuración</p>
    <ion-button class="boton-cerrar" fill="clear" (click)="cerrarPantalla()">
      <ion-icon name="close-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="contenido">

    <p class="titulo-gris">Preferencias</p>
    <div class="card-ajuste">
      <div class="item-ajuste">
        <img src="/assets/img/ajustes/A-1.svg" alt="Idioma" />
        <span>Idioma</span>
        <div class="dropdown-f">
          Español
          <ion-icon name="chevron-down-outline"></ion-icon>
        </div>
      </div>
      <div class="item-ajuste">
        <img src="/assets/img/ajustes/A-2.svg" alt="Tema" />
        <span>Tema</span>
        <div class="dropdown-f">
          Modo dia
          <ion-icon name="chevron-down-outline"></ion-icon>
        </div>
      </div>
    </div>

    <p class="titulo-gris">Funciones</p>
    <div class="card-ajuste">
      <div class="item-simple">
        <img src="/assets/img/ajustes/A-3.svg" alt="Exportar"  />
        <span>Exportar documento</span>
      </div>
      <div class="item-simple">
        <img src="/assets/img/ajustes/A-4.svg" alt="Mostrar/Ocultar" />
        <span>Mostrar/ocultar opciones</span>
      </div>
    </div>

    <p class="titulo-gris">Ayuda</p>
    <div class="card-ajuste">
      <div class="item-simple">
        <img src="/assets/img/ajustes/A-5.svg" alt="Términos" />
        <span>Términos y condiciones</span>
      </div>
      <div class="item-simple">
        <img src="/assets/img/ajustes/A-6.svg" alt="FAQ" />
        <span>FAQ</span>
      </div>
    </div>

    <p class="titulo-gris">Cuenta</p>
    <div class="card-ajuste">
      <div class="item-simple">
        <img src="/assets/img/ajustes/A-7.svg" alt="Contraseña" />
        <span>Cambiar contraseña</span>
      </div>
      <div class="item-simple borrar">
        <img src="/assets/img/ajustes/A-8.svg" alt="Borrar cuenta" />
        <span>Borrar cuenta</span>
      </div>
    </div>

  </div>
</ion-content>
