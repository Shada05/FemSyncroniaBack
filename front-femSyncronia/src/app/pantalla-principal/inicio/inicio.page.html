<ion-content>
  <ion-tabs>
    <ion-tab tab="principal">
      <div id="pagina-principal">
        <ion-content>
          <div class="top-bar">
            <ion-icon class="notificacion" src="/assets/icons/pantalla-principal/campana.svg"></ion-icon>
            <ion-text class="bienvenida-text">
              Bienvenida
            </ion-text>
            <img class="imagen-perfil" [src]="profileImage" alt="Foto de perfil">
          </div>
        </ion-content>
      </div>
    </ion-tab>
    <ion-tab tab="calendario">
      <div id="pagina-calendario">
        <ion-content>
          <div class="center">Contenido calendario</div>
        </ion-content>
      </div>
    </ion-tab>
    <ion-tab tab="grafica">
      <div id="pagina-grafica">
        <ion-content>
          <div class="center">Contenido grafica</div>
        </ion-content>
      </div>
    </ion-tab>
    <ion-tab tab="buscar">
      <div id="page-buscar">
        <ion-content>
          <div class="center">Contenido buscar</div>
        </ion-content>
      </div>
    </ion-tab>

    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="principal">
        <ion-icon src="../../../assets/icons/Tabs/Hogar.svg"></ion-icon>
        Inicio
      </ion-tab-button>
      <ion-tab-button tab="calendario">
        <ion-icon src="../../../assets/icons/Tabs/Calendario.svg"></ion-icon>
        Calendario
      </ion-tab-button>
      <ion-tab-button tab="grafica">
        <ion-icon src="../../../assets/icons/Tabs/Estadisticas.svg"></ion-icon>
        Gráfica
      </ion-tab-button>
      <ion-tab-button tab="buscar">
        <ion-icon src="../../../assets/icons/Tabs/Buscar.svg"></ion-icon>
        Buscar
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
