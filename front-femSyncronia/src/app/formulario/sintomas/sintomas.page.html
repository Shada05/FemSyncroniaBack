<ion-content>
  <div class="center">
    <div>
      <h1>¿Qué síntomas</h1>
      <h1>presentas?</h1>
      <ion-text>
        Nuestro periodo tiene a afectar varios
      </ion-text>
      <ion-text>
        factores de nuestra vida cotidiana.
      </ion-text>
    </div>

    <!-- Contenedor Principal -->
    <div class="contenedor-sintomas">
      <!-- Iterar sobre los tipos de síntomas -->
      <div *ngFor="let tipo of tiposSintomas">
        <ion-text class="tipo-sintoma">{{ obtenerNombreTipo(tipo.id) }}</ion-text>

        <div class="lista-sintomas">
          <ion-card class="sintoma-card" *ngFor="let sintoma of sintomasPorTipo[tipo.id]"
            [ngClass]="{ 'calificado': sintoma.mostrarEstrellas || sintoma.estrellas > 0 }"> <!-- Agregar clase dinámica -->
            <ion-item lines="none">
              <ion-text class="sintoma-texto">{{ sintoma.nombre }}</ion-text>
            </ion-item>
            <!-- Contenedor de la imagen con el ícono de exclamación -->
            <div class="imagen-contenedor">
              <ion-img [src]="sintoma.imagen" (click)="toggleEstrellas(sintoma)" class="sintoma-imagen"></ion-img>
              <!-- Ícono de exclamación -->
              <ion-icon name="alert-circle-outline" class="icono-exclamacion" (click)="mostrarPopover($event, sintoma)">
              </ion-icon>
            </div>
            <!-- Sistema de estrellas -->
            <div class="estrellas-container">
              <ion-icon *ngFor="let estrella of [1, 2, 3, 4, 5]"
                [name]="estrella <= sintoma.estrellas ? 'star' : 'star'" (click)="calificar(sintoma, estrella)"
                class="estrella" [style.color]="estrella <= sintoma.estrellas ? '#FFD700' : '#c4c4c4'"
                [style.visibility]="sintoma.mostrarEstrellas ? 'visible' : 'hidden'">
              </ion-icon>
            </div>
          </ion-card>
        </div>
      </div>
    </div>

    <div class="divisor"></div>

    <div class="contenedor-boton">
      <ion-button class="btn-continuar" type="submit" (click)="enviarSintomas()">
        Continuar
      </ion-button>
    </div>

    <span><a [routerLink]="['/registro']">¿Necesitas ayuda?</a></span>
  </div>
</ion-content>
